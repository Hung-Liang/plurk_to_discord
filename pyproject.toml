[project]
name = "plurk-to-discord"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 4.x is a rewrite with a different API
    "apscheduler>=3.11.3,<4",
    # Imported directly to sign requests with a timeout
    "oauth2>=1.9.0.post1",
    "plurk-oauth>=0.9.2",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "requests>=2.34.2",
    # oauth2 imports distutils, removed in Python 3.12; setuptools provides it
    "setuptools>=84.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
